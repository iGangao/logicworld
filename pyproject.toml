[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logicworld"
version = "0.1.0"
description = "LOGICWorld: Automated Deep Logic Generation for Interactive Reasoning in Embodied Agents."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MulanPSL-2.0" }
authors = [
    { name = "Gangao Liu" },
    { name = "Huixin Xu" },
    { name = "Mengna Wang" },
    { name = "Peng Li", email = "lipeng@iscas.ac.cn" },
]
maintainers = [
    { name = "Peng Li", email = "lipeng@iscas.ac.cn" },
]
keywords = [
    "embodied-ai",
    "reinforcement-learning",
    "gymnasium",
    "household",
    "logic",
    "benchmark",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Mulan Permissive Software License v2 (MulanPSL-2.0)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "gymnasium>=0.29.0",
    "numpy>=1.23.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "tqdm>=4.65",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/iGangao/logicworld"
Repository = "https://github.com/iGangao/logicworld"
Paper = "papers/LOGICWorld_IROS2026.pdf"

[project.scripts]
logicworld = "logicworld.cli:main"

[tool.setuptools.packages.find]
include = ["logicworld*"]

[tool.setuptools.package-data]
logicworld = ["py.typed", "configs/*.json"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
